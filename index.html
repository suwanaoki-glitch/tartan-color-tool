<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タータンレジスター カラーツール</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 10px; }
  .sub-note { text-align:center; color:#666; margin-bottom:20px; font-size:14px;}

  .input-group { margin-bottom: 15px; text-align:center;}
  .input-group input {
    padding:8px; font-size:15px; border-radius:6px; border:1px solid #ccc;
    width: 300px; max-width:80%;
  }

  .category-filters {
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:15px;
  }
  .category-filters button {
    padding:6px 14px; border-radius:20px; border:1px solid #999;
    background:#fff; cursor:pointer; font-size:13px;
  }
  .category-filters button.active {
    background:#333; color:#fff; border-color:#333;
  }

  .main-layout {
    display:flex; gap:20px; align-items:flex-start;
  }
  .palette-panel {
    flex: 2;
    background:#fff; border-radius:10px; padding:15px;
    box-shadow:0 1px 4px rgba(0,0,0,0.1);
  }
  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel-box {
    background:#fff; border-radius:10px; padding:15px;
    box-shadow:0 1px 4px rgba(0,0,0,0.1);
  }
  .panel-box h2 { font-size:16px; margin-top:0;}

  .color-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(95px,1fr));
    gap:8px;
    max-height:75vh;
    overflow-y:auto;
    padding-right:4px;
  }
  .color-swatch {
    cursor:pointer;
    border-radius:6px;
    padding:6px 4px;
    text-align:center;
    font-size:10px;
    border:2px solid transparent;
    line-height:1.3;
    word-break: break-word;
  }
  .color-swatch.selected {
    border-color:#111;
    box-shadow: 0 0 0 2px gold inset;
  }
  .color-swatch .cname { font-weight:bold; }

  .selected-list { max-height: 40vh; overflow-y:auto; margin-bottom:5px;}
  .selected-item {
    background:#f7f7f7; border-radius:8px; padding:10px; margin-bottom:10px;
  }
  .selected-item .row { display:flex; gap:8px; align-items:flex-start; }
  .swatch-mini {
    width:34px; height:34px; border-radius:6px; flex-shrink:0;
    border:1px solid #ccc;
  }
  .selected-item .info { flex:1; min-width:0; }
  .selected-item .info b { font-size:13px; }
  .code-badge {
    display:inline-block; background:#333; color:#fff; font-size:10px;
    padding:1px 6px; border-radius:10px; margin-right:6px;
  }
  .selected-item .info .hex { font-size:11px; color:#666; }
  .count-input { width:55px; padding:3px; margin-top:4px; font-size:12px;}
  .reason-input { width:100%; padding:4px; margin-top:4px; font-size:12px; border-radius:4px; border:1px solid #ccc;}
  .reorder-btns { display:flex; flex-direction:column; gap:2px; }
  .reorder-btns button {
    font-size:11px; padding:2px 6px; cursor:pointer; border-radius:4px; border:1px solid #ccc; background:#fff;
  }
  .reorder-btns .remove-btn { color:#c00; }

  .pattern-controls label { display:block; font-size:13px; margin-bottom:8px; }
  .pattern-controls input[type=number] { width:80px; padding:4px; margin-left:6px;}
  #generateBtn {
    width:100%; padding:12px; font-size:15px; font-weight:bold;
    background:#2c5f8a; color:#fff; border:none; border-radius:8px; cursor:pointer;
    margin-top:8px;
  }
  #generateBtn:hover { background:#1f466a; }

  .pattern-result { text-align:center; }
  #tartanCanvas {
    max-width: 100%;
    height: auto;
    border:1px solid #ddd;
    border-radius:6px;
  }
  .export-buttons {
    margin-top:12px; display:flex; flex-direction:column; gap:10px;
  }
  .export-buttons button {
    padding:12px; font-size:14px; font-weight:bold;
    border:none; border-radius:8px; cursor:pointer; color:#fff; width:100%;
  }
  #downloadImgBtn { background:#3a7d44; }
  #downloadImgBtn:hover { background:#2d5f34; }
  #posterBtn { background:#a85c32; }
  #posterBtn:hover { background:#8a4a28; }

  .empty-msg { color:#999; font-size:13px; text-align:center; padding:20px 0; }

  @media (max-width: 900px) {
    .main-layout { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🏴 タータンレジスター カラーツール</h1>
  <p class="sub-note">公式137色から選んでオリジナルタータンを作成・ダウンロードできます</p>

  <div class="input-group">
    <input type="text" id="orgName" maxlength="30" placeholder="応募者名・団体名を入力（ポスター上部に表示されます）">
  </div>

  <div class="category-filters" id="categoryFilters"></div>

  <div class="main-layout">
    <!-- 左: カラーパレット -->
    <div class="palette-panel">
      <h2>🎨 カラーパレット（クリックで選択）</h2>
      <div class="color-grid" id="colorGrid"></div>
    </div>

    <!-- 右: 選択リスト → 設定 → 生成結果 を1列で -->
    <div class="right-column">
      <div class="panel-box">
        <h2>✅ 選択した色（<span id="selectedCount">0</span>色）</h2>
        <div class="selected-list" id="selectedList">
          <div class="empty-msg">左から色を選んでください</div>
        </div>
      </div>

      <div class="panel-box pattern-controls">
        <h2>⚙ 生成設定</h2>
        <label>繰り返し回数:
          <input type="number" id="repeatCount" value="4" min="1" max="20">
        </label>
        <label>画像サイズ(px):
          <input type="number" id="canvasSize" value="1600" min="400" max="3000" step="100">
        </label>
        <button id="generateBtn">🎨 タータンを生成</button>
      </div>

      <div class="panel-box pattern-result">
        <h2>🖼 生成されたタータン</h2>
        <canvas id="tartanCanvas" width="1600" height="1600"></canvas>
        <div class="export-buttons">
          <button id="downloadImgBtn">⬇ 高画質で保存</button>
          <button id="posterBtn">🖼 投票用ポスターを作成</button>
        </div>
      </div>
    </div>
  </div>
</div>

<canvas id="posterCanvas" style="display:none;"></canvas>

const CATEGORIES = [
  {key:"all",label:"すべて"},
  {key:"red",label:"レッド系"},
  {key:"blue",label:"ブルー系"},
  {key:"green",label:"グリーン系"},
  {key:"yellow",label:"イエロー系"},

  {key:"gold",label:"ゴールド/クリーム系"}
];

const CAT_ABBR = {
  red:"R", blue:"B", green:"Gn", yellow:"Y", orange:"O", purple:"P",
  black:"Bk", white:"W", grey:"Gr", brown:"Br", pink:"Pk", gold:"Gd"
};

let currentFilter = "all";
let selectedColors = []; // {name, hex, cat, count, reason}

/* ===================== 初期化 ===================== */
function init(){
  renderCategoryFilters();
  renderPalette();
  renderSelected();
  document.getElementById("generateBtn").onclick = generateTartan;
  document.getElementById("downloadImgBtn").onclick = downloadImage;
  document.getElementById("posterBtn").onclick = createPoster;
}

function renderCategoryFilters(){
  const wrap = document.getElementById("categoryFilters");
  wrap.innerHTML = "";
  CATEGORIES.forEach(c=>{
    const btn = document.createElement("button");
    btn.textContent = c.label;
    if(c.key === currentFilter) btn.classList.add("active");
    btn.onclick = ()=>{ currentFilter = c.key; renderCategoryFilters(); renderPalette(); };
    wrap.appendChild(btn);
  });
}

function isLight(hex){
  const r = parseInt(hex.substr(1,2),16);
  const g = parseInt(hex.substr(3,2),16);
  const b = parseInt(hex.substr(5,2),16);
  return (r*299+g*587+b*114)/1000 > 150;
}

function getCode(cat, idx){
  return (CAT_ABBR[cat] || "C") + (idx+1);
}

function renderPalette(){
  const grid = document.getElementById("colorGrid");
  grid.innerHTML = "";
  const list = COLORS.filter(c=> currentFilter==="all" || c.cat===currentFilter);
  list.forEach(c=>{
    const isSel = selectedColors.some(s=>s.hex===c.hex && s.name===c.name);
    const div = document.createElement("div");
    div.className = "color-swatch" + (isSel ? " selected" : "");
    div.style.background = c.hex;
    div.style.color = isLight(c.hex) ? "#000" : "#fff";
    div.innerHTML = `<div class="cname">${c.name}</div><div>${c.hex}</div>`;
    div.onclick = ()=> toggleColor(c);
    grid.appendChild(div);
  });
}

function toggleColor(c){
  const idx = selectedColors.findIndex(s=>s.hex===c.hex && s.name===c.name);
  if(idx>=0){
    selectedColors.splice(idx,1);
  }else{
    selectedColors.push({name:c.name, hex:c.hex, cat:c.cat, count:6, reason:""});
  }
  renderPalette();
  renderSelected();
}

function renderSelected(){
  const list = document.getElementById("selectedList");
  document.getElementById("selectedCount").textContent = selectedColors.length;
  if(selectedColors.length === 0){
    list.innerHTML = `<div class="empty-msg">左から色を選んでください</div>`;
    return;
  }
  list.innerHTML = "";
  selectedColors.forEach((c,i)=>{
    const code = getCode(c.cat, i);
    const div = document.createElement("div");
    div.className = "selected-item";
    div.innerHTML = `
      <div class="row">
        <div class="swatch-mini" style="background:${c.hex}"></div>
        <div class="info">
          <b><span class="code-badge">${code}</span>${c.name}</b><br>
          <span class="hex">${c.hex}</span>
          <div>
            <input type="number" class="count-input" data-idx="${i}" min="2" step="2" value="${c.count}"> 本
          </div>
          <input type="text" class="reason-input" data-idx="${i}" maxlength="20" placeholder="選定理由（20字以内）" value="${c.reason}">
        </div>
        <div class="reorder-btns">
          <button class="up-btn" data-idx="${i}" ${i===0?"disabled":""}>▲</button>
          <button class="down-btn" data-idx="${i}" ${i===selectedColors.length-1?"disabled":""}>▼</button>
          <button class="remove-btn" data-idx="${i}">✕</button>
        </div>
      </div>`;
    list.appendChild(div);
  });

  list.querySelectorAll(".count-input").forEach(inp=>{
    inp.onchange = (e)=>{
      let v = parseInt(e.target.value) || 2;
      if(v % 2 !== 0){
        v = v + 1;
        alert("スレッド数は必ず2の倍数です。自動的に " + v + " 本に修正しました。");
      }
      if(v < 2) v = 2;
      selectedColors[+e.target.dataset.idx].count = v;
      e.target.value = v;
    };
  });
  list.querySelectorAll(".reason-input").forEach(inp=>{
    inp.onchange = (e)=>{
      selectedColors[+e.target.dataset.idx].reason = e.target.value;
    };
  });
  list.querySelectorAll(".up-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      const i = +e.target.dataset.idx;
      if(i>0){
        [selectedColors[i-1], selectedColors[i]] = [selectedColors[i], selectedColors[i-1]];
        renderSelected();
      }
    };
  });
  list.querySelectorAll(".down-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      const i = +e.target.dataset.idx;
      if(i < selectedColors.length-1){
        [selectedColors[i+1], selectedColors[i]] = [selectedColors[i], selectedColors[i+1]];
        renderSelected();
      }
    };
  });
  list.querySelectorAll(".remove-btn").forEach(btn=>{
    btn.onclick = (e)=>{
      const i = +e.target.dataset.idx;
      selectedColors.splice(i,1);
      renderSelected();
      renderPalette();
    };
  });
}

/* ===================== タータン生成（2/2綾織り・左右対称） ===================== */
function buildSequence(){
  let half = [];
  selectedColors.forEach(c=>{
    for(let i=0;i<c.count;i++) half.push(c.hex);
  });
  if(half.length === 0) return [];
  const mirror = half.slice(0,-1).reverse();
  return half.concat(mirror);
}

function drawTwill(ctx, size, seq, repeat){
  let threads = [];
  for(let r=0;r<repeat;r++) threads = threads.concat(seq);
  const total = threads.length;
  const unit = size/total;
  for(let ty=0; ty<total; ty++){
    for(let tx=0; tx<total; tx++){
      const step = (tx+ty) % 4;
      ctx.fillStyle = step < 2 ? threads[tx] : threads[ty];
      ctx.fillRect(
        Math.floor(tx*unit),
        Math.floor(ty*unit),
        Math.ceil(unit)+1,
        Math.ceil(unit)+1
      );
    }
  }
}

function generateTartan(){
  if(selectedColors.length === 0){
    alert("色を選択してください");
    return;
  }
  const seq = buildSequence();
  const size = parseInt(document.getElementById("canvasSize").value) || 1600;
  const repeat = parseInt(document.getElementById("repeatCount").value) || 4;

  if(seq.length * repeat > 400){
    if(!confirm("設定が細かすぎる可能性があります。生成に時間がかかる場合がありますが続行しますか？")) return;
  }

  const canvas = document.getElementById("tartanCanvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  drawTwill(ctx, size, seq, repeat);
}

function downloadImage(){
  const canvas = document.getElementById("tartanCanvas");
  const link = document.createElement("a");
  const orgName = document.getElementById("orgName").value || "tartan";
  link.download = `${orgName}_pattern.jpg`;
  link.href = canvas.toDataURL("image/jpeg", 0.95);
  link.click();
}

/* ===================== 角丸四角形ヘルパー ===================== */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* 文字間を少し空けて描画（手動レタースペーシング） */
function fillTextSpaced(ctx, text, x, y, spacing){
  let curX = x;
  const widths = [...text].map(ch=>ctx.measureText(ch).width);
  const totalWidth = widths.reduce((a,b)=>a+b,0) + spacing*(text.length-1);
  curX = x - totalWidth/2;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = "left";
  [...text].forEach((ch,i)=>{
    ctx.fillText(ch, curX, y);
    curX += widths[i] + spacing;
  });
  ctx.textAlign = prevAlign;
}

/* ===================== 投票用ポスター作成（エレガント版） ===================== */
function createPoster(){
  if(selectedColors.length === 0){
    alert("先に色を選択してタータンを生成してください");
    return;
  }
  const patternCanvas = document.getElementById("tartanCanvas");
  const orgName = document.getElementById("orgName").value || "（応募者名未入力）";

  const pW = 1240;
  const pH = 1754;
  const outerMargin = 50;
  const innerMargin = 90;

  const posterCanvas = document.getElementById("posterCanvas");
  posterCanvas.width = pW;
  posterCanvas.height = pH;
  const ctx = posterCanvas.getContext("2d");

  const GOLD = "#b8933f";
  const GOLD_SOFT = "#cdb06a";
  const INK = "#2b2b2b";
  const SUBTEXT = "#8a8a8a";

  // --- 背景（クリーム系） ---
  ctx.fillStyle = "#faf7f0";
  ctx.fillRect(0,0,pW,pH);

  // --- 二重フレーム（高級感） ---
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 2;
  ctx.strokeRect(outerMargin, outerMargin, pW-outerMargin*2, pH-outerMargin*2);
  ctx.strokeStyle = GOLD_SOFT;
  ctx.lineWidth = 1;
  ctx.strokeRect(outerMargin+10, outerMargin+10, pW-(outerMargin+10)*2, pH-(outerMargin+10)*2);

  let y = innerMargin + 10;

  // --- 小さなラベル（上部） ---
  ctx.textAlign = "center";
  ctx.fillStyle = GOLD;
  ctx.font = "14px 'Hiragino Mincho ProN', serif";
  fillTextSpaced(ctx, "FUJIIDERA TARTAN DESIGN", pW/2, y, 6);
  y += 46;

  // --- 応募者名／団体名（明朝体・大きく） ---
  ctx.fillStyle = INK;
  ctx.font = "bold 56px 'Hiragino Mincho ProN', 'Yu Mincho', serif";
  ctx.fillText(orgName, pW/2, y + 50);
  y += 92;

  // --- 装飾ライン＋ダイヤモンド ---
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pW/2 - 160, y);
  ctx.lineTo(pW/2 - 16, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pW/2 + 16, y);
  ctx.lineTo(pW/2 + 160, y);
  ctx.stroke();
  ctx.save();
  ctx.translate(pW/2, y);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle = GOLD;
  ctx.fillRect(-5,-5,10,10);
  ctx.restore();
  y += 46;

  // --- タータン画像 ---
  const patternSize = pW - innerMargin*2;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.22)";
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 8;
  ctx.drawImage(patternCanvas, innerMargin, y, patternSize, patternSize);
  ctx.restore();
  ctx.strokeStyle = GOLD_SOFT;
  ctx.lineWidth = 2;
  ctx.strokeRect(innerMargin, y, patternSize, patternSize);
  y += patternSize + 48;

  // --- セクション見出し ---
  ctx.textAlign = "left";
  ctx.fillStyle = GOLD;
  ctx.fillRect(innerMargin, y-4, 5, 26);
  ctx.fillStyle = INK;
  ctx.font = "bold 24px 'Hiragino Mincho ProN', serif";
  ctx.fillText("使 用 カ ラ ー", innerMargin + 18, y + 18);
  y += 20;

  // --- カラーカード ---
  const count = selectedColors.length;
  const cols = count <= 3 ? count : 3;
  const gap = 18;
  const cardW = (patternSize - gap*(cols-1)) / cols;
  const cardH = 150;

  selectedColors.forEach((c,i)=>{
    const code = getCode(c.cat, i);
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = innerMargin + col*(cardW+gap);
    const cy = y + 26 + row*(cardH+gap);

    // カード背景（控えめな影）
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.06)";
    ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffffff";
    roundRect(ctx, cx, cy, cardW, cardH, 4);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#e6ddc8";
    ctx.lineWidth = 1;
    roundRect(ctx, cx, cy, cardW, cardH, 4);
    ctx.stroke();

    // 色スウォッチ
    ctx.fillStyle = c.hex;
    ctx.fillRect(cx+16, cy+16, 42, 42);
    ctx.strokeStyle = "#ccc";
    ctx.lineWidth = 1;
    ctx.strokeRect(cx+16, cy+16, 42, 42);

    // コードバッジ（ゴールド円）
    ctx.beginPath();
    ctx.arc(cx+90, cy+28, 16, 0, Math.PI*2);
    ctx.fillStyle = GOLD;
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(code, cx+90, cy+32);

    // 名前
    ctx.textAlign = "left";
    ctx.fillStyle = INK;
    ctx.font = "bold 18px 'Hiragino Mincho ProN', serif";
    ctx.fillText(c.name, cx+116, cy+33);

    // HEX・本数
    ctx.font = "12px sans-serif";
    ctx.fillStyle = SUBTEXT;
    ctx.fillText(`${c.hex} ／ ${c.count}本`, cx+16, cy+82);

    // 区切り線
    ctx.strokeStyle = "#eee";
    ctx.beginPath();
    ctx.moveTo(cx+16, cy+92);
    ctx.lineTo(cx+cardW-16, cy+92);
    ctx.stroke();

    // 理由（イタリック風）
    ctx.fillStyle = "#555";
    ctx.font = "italic 13px 'Hiragino Mincho ProN', serif";
    const reasonText = c.reason ? c.reason : "（理由未記入）";
    wrapText(ctx, reasonText, cx+16, cy+112, cardW-32, 19);
  });

  // --- フッター ---
  ctx.strokeStyle = GOLD_SOFT;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pW/2 - 100, pH - 96);
  ctx.lineTo(pW/2 + 100, pH - 96);
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.fillStyle = "#a89a7a";
  ctx.font = "15px 'Hiragino Mincho ProN', serif";
  fillTextSpaced(ctx, "藤井寺まちリンク協議会", pW/2, pH - 56, 4);

  // ダウンロード
  const link = document.createElement("a");
  const fileName = `${orgName}_poster.jpg`;
  link.download = fileName;
  link.href = posterCanvas.toDataURL("image/jpeg", 0.95);
  link.click();
}

// テキスト折り返し描画
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  let line = "";
  let curY = y;
  for(let i=0; i<text.length; i++){
    const testLine = line + text[i];
    if(ctx.measureText(testLine).width > maxWidth && line !== ""){
      ctx.fillText(line, x, curY);
      line = text[i];
      curY += lineHeight;
    }else{
      line = testLine;
    }
  }
  ctx.fillText(line, x, curY);
}
