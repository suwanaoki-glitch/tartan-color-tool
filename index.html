<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tartan Register カラーコードジェネレーター</title>
<style>
  body {
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #f4f4f8;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .pdf-notice {
    background: #fff3cd;
    border: 2px solid #ffc107;
    border-radius: 10px;
    padding: 15px 20px;
    margin: 15px auto;
    font-size: 14px;
    text-align: center;
    max-width: 700px;
  }
  .pdf-notice a {
    display: inline-block;
    margin-top: 8px;
    background: #ffc107;
    color: #000;
    padding: 6px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }
  .pdf-notice a:hover { background: #e0a800; }

  .palette-container {
    max-width: 1000px;
    margin: 0 auto 20px auto;
    background: #fff;
    border: 2px solid #4a69bd;
    border-radius: 10px;
    padding: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .palette-container h3 { margin: 0 0 10px 0; font-size: 15px; }
  .palette-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .palette-item {
    position: relative;
    width: 70px;
    text-align: center;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    transition: transform 0.15s;
  }
  .palette-item:hover { transform: scale(1.08); }
  .palette-item .swatch-color { width: 100%; height: 45px; }
  .palette-item .swatch-label {
    font-size: 10px; padding: 3px 0; background: white; font-weight: bold;
  }
  .palette-item .remove-x {
    position: absolute; top: 2px; right: 2px;
    background: rgba(0,0,0,0.65); color: white;
    border-radius: 50%; width: 16px; height: 16px;
    font-size: 10px; line-height: 16px;
  }
  .empty-message { color: #999; font-style: italic; margin: 0; }

  .toolbar {
    max-width: 1000px; margin: 0 auto 20px auto;
    background: white; border-radius: 10px; padding: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  textarea#output {
    width: 100%; height: 80px; font-family: monospace; font-size: 14px;
    box-sizing: border-box; padding: 8px; border: 1px solid #ccc;
    border-radius: 6px; resize: vertical;
  }
  .buttons { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  .buttons button {
    padding: 8px 16px; border: none; border-radius: 6px;
    cursor: pointer; font-size: 14px; background: #4a69bd; color: white;
  }
  .buttons button.reset { background: #e55039; }
  .buttons button:hover { opacity: 0.85; }

  .filters {
    max-width: 1000px; margin: 0 auto 20px auto;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .filters button {
    padding: 6px 14px; border: 1px solid #999; border-radius: 20px;
    background: white; cursor: pointer; font-size: 13px;
  }
  .filters button.active { background: #333; color: white; border-color: #333; }

  .grid {
    max-width: 1000px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .card {
    border-radius: 8px; padding: 10px; cursor: pointer; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2); transition: transform 0.1s;
    font-size: 12px; user-select: none;
  }
  .card:hover { transform: scale(1.05); }
  .card .abbr { font-weight: bold; font-size: 15px; }
  .card .name { margin: 3px 0; }
  .card .hex { font-family: monospace; font-size: 11px; }

  #notify {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333; color: white; padding: 10px 20px;
    border-radius: 20px; opacity: 0; transition: all 0.3s; z-index: 999;
  }
  #notify.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>🎨 Tartan Register カラーコードジェネレーター</h1>
  <p>色カードをクリックするとパレットとコードに追加されます</p>
</div>

<div class="pdf-notice">
  ⚠️ 色は画面環境により見え方が異なる場合があります。<br>
  正確な色の確認は公式PDFをご覧ください 👉
  <br>
  <a href="https://www.tartanregister.gov.uk/docs/Colour_shades.pdf" target="_blank" rel="noopener noreferrer">
    📄 公式カラーシェードPDFを開く
  </a>
</div>

<div class="palette-container">
  <h3>🎨 選んだ色のパレット（クリックで削除）</h3>
  <div id="paletteSwatches" class="palette-swatches">
    <p class="empty-message">まだ色が選ばれていません</p>
  </div>
</div>

<div class="toolbar">
  <textarea id="output" placeholder="ここにコードが追加されます。例: LR=#F04DB0#LIGHTRED;"></textarea>
  <div class="buttons">
    <button onclick="copyAll()">📋 全部コピー</button>
    <button class="reset" onclick="resetOutput()">🗑️ リセット</button>
  </div>
</div>

<div class="filters" id="filters"></div>

<div class="grid" id="grid"></div>

<div id="notify"></div>

// ===== カテゴリー一覧 =====
const categories = [
  {key:"all", label:"全て"},
  {key:"red", label:"赤系"},
  {key:"orange", label:"橙系"},
  {key:"yellow", label:"黄系"},
  {key:"green", label:"緑系"},
  {key:"blue", label:"青系"},
  {key:"purple", label:"紫系"},
  {key:"white", label:"白系"},
  {key:"grey", label:"灰系"},
  {key:"black", label:"黒"},
  {key:"brown", label:"茶系"}
];

// ===== 状態管理 =====
let selectedColors = [];
let currentFilter = "all";

// ===== 文字色を自動調整 =====
function getContrastColor(hex) {
  const r = parseInt(hex.substr(1,2),16);
  const g = parseInt(hex.substr(3,2),16);
  const b = parseInt(hex.substr(5,2),16);
  const brightness = (r*299 + g*587 + b*114) / 1000;
  return brightness > 150 ? "#000000" : "#ffffff";
}

// ===== フィルターボタン描画 =====
function renderFilters() {
  const container = document.getElementById("filters");
  container.innerHTML = "";
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat.label;
    if (cat.key === currentFilter) btn.classList.add("active");
    btn.onclick = () => {
      currentFilter = cat.key;
      renderFilters();
      renderGrid();
    };
    container.appendChild(btn);
  });
}

// ===== カラーカード描画 =====
function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const filtered = currentFilter === "all" ? colors : colors.filter(c => c.category === currentFilter);
  filtered.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.background = c.hex;
    card.style.color = getContrastColor(c.hex);
    card.innerHTML = `
      <div class="abbr">${c.abbr}</div>
      <div class="name">${c.name}</div>
      <div class="hex">${c.hex}</div>
    `;
    card.onclick = () => addColor(c);
    grid.appendChild(card);
  });
}

// ===== 色を追加（パレット＋テキスト欄＋自動コピー） =====
function addColor(c) {
  const code = `${c.abbr}=${c.hex}#${c.name.toUpperCase().replace(/\s+/g,'')};`;
  selectedColors.push({...c, code});
  renderPalette();
  updateOutput();
  navigator.clipboard.writeText(code).catch(()=>{});
  showNotify(`コピーしました: ${code}`);
}

// ===== パレットから削除 =====
function removeFromPalette(index) {
  const removed = selectedColors[index];
  selectedColors.splice(index, 1);
  renderPalette();
  updateOutput();
  showNotify(`${removed.name} を削除しました`);
}

// ===== パレット表示更新 =====
function renderPalette() {
  const container = document.getElementById("paletteSwatches");
  if (selectedColors.length === 0) {
    container.innerHTML = '<p class="empty-message">まだ色が選ばれていません</p>';
    return;
  }
  container.innerHTML = "";
  selectedColors.forEach((c, index) => {
    const item = document.createElement("div");
    item.className = "palette-item";
    item.onclick = () => removeFromPalette(index);
    item.innerHTML = `
      <div class="remove-x">×</div>
      <div class="swatch-color" style="background-color:${c.hex};"></div>
      <div class="swatch-label">${c.abbr}</div>
    `;
    container.appendChild(item);
  });
}

// ===== テキストエリア更新 =====
function updateOutput() {
  document.getElementById("output").value = selectedColors.map(c => c.code).join("\n");
}

// ===== 全部コピー =====
function copyAll() {
  const output = document.getElementById("output");
  if (!output.value) {
    showNotify("コピーする内容がありません");
    return;
  }
  navigator.clipboard.writeText(output.value).then(() => {
    showNotify("全てコピーしました！");
  }).catch(() => {
    showNotify("コピーに失敗しました");
  });
}

// ===== リセット =====
function resetOutput() {
  selectedColors = [];
  renderPalette();
  updateOutput();
  showNotify("リセットしました");
}

// ===== 通知表示 =====
function showNotify(msg) {
  const el = document.getElementById("notify");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._notifyTimer);
  window._notifyTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

// ===== 初期化 =====
renderFilters();
renderGrid();
renderPalette();
</script>

</body>
</html>
