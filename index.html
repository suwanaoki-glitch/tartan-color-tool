<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    background: #f5f3ef;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  h1 {
    text-align: center;
    color: #14283C;
    font-size: 24px;
    margin-bottom: 20px;
  }
  .container {
    display: flex;
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .left-panel, .right-panel {
    flex: 1;
    min-width: 400px;
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .guide-box {
    background: #fffbe6;
    border: 1px solid #e0d9b0;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13.5px;
    line-height: 1.8;
    white-space: pre-line;
  }
  .guide-box b { color: #8a6d00; }
  .filter-bar { margin-bottom: 10px; }
  .filter-btn {
    display: inline-block;
    padding: 5px 12px;
    margin: 2px;
    border: 1px solid #999;
    border-radius: 16px;
    background: #fff;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }
  .filter-btn.active { background: #14283C; color: #fff; border-color: #14283C; }
  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    max-height: 460px;
    overflow-y: auto;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
  }
  .swatch {
    position: relative;
    width: 100%;
    padding-top: 100%;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.selected {
    border-color: #14283C;
    box-shadow: 0 0 0 2px gold inset;
  }
  .swatch:hover { transform: scale(1.08); transition: 0.1s; }
  .swatch-label {
    position: absolute;
    bottom: -16px;
    left: 0; right: 0;
    text-align: center;
    font-size: 8px;
    color: #666;
  }
  .selected-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0 16px;
    max-height: 260px;
    overflow-y: auto;
  }
  .selected-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    font-size: 12.5px;
  }
  .selected-item .sw {
    width: 34px; height: 34px;
    border-radius: 6px;
    border: 1px solid #ccc;
    flex-shrink: 0;
  }
  .selected-item .info { flex: 1; min-width: 100px; }
  .selected-item .info b { font-size: 13px; }
  .selected-item input[type=number] { width: 54px; font-size: 12px; }
  .selected-item input[type=text] { width: 130px; font-size: 12px; }
  .reorder-btns { display: flex; flex-direction: column; gap: 2px; }
  .reorder-btns button, .remove-btn {
    border: none; background: #eee; border-radius: 4px;
    cursor: pointer; font-size: 11px; padding: 2px 6px;
  }
  .remove-btn { background: #fde; color: #c00; }
  .controls-row {
    display: flex; align-items: center; gap: 10px;
    margin: 10px 0; flex-wrap: wrap;
  }
  .controls-row label { font-size: 13px; }
  .controls-row input[type=number] { width: 60px; }
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #14283C;
    color: #fff;
    cursor: pointer;
    font-size: 14.5px;
    margin: 4px 6px 4px 0;
  }
  .btn:hover { background: #1f3a57; }
  .btn.secondary { background: #8a6d00; }
  .btn.secondary:hover { background: #a9840a; }
  canvas#tartanCanvas {
    display: block;
    margin: 10px auto;
    border: 1px solid #ccc;
    border-radius: 8px;
    width: 360px;
    height: 360px;
  }
  .name-input-area {
    background: #faf8f3;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 14px;
    margin: 14px 0;
  }
  .name-input-area label {
    font-weight: bold;
    font-size: 13.5px;
    display: block;
    margin-bottom: 4px;
  }
  #nameInput {
    font-size: 30px;
    width: 100%;
    padding: 6px 10px;
    box-sizing: border-box;
    text-align: right;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-weight: bold;
    color: #14283C;
  }
  #conceptInput {
    width: 100%;
    font-size: 14px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 6px;
    resize: vertical;
  }
  #submissionText {
    width: 100%;
    height: 220px;
    font-family: 'Courier New', monospace;
    font-size: 11.5px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    white-space: pre;
  }
  #codeOutput {
    font-family: monospace;
    background: #eef;
    padding: 8px 12px;
    border-radius: 6px;
    display: inline-block;
    margin-top: 6px;
    font-size: 13px;
  }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: #14283C;
    color: #fff;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13.5px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  #posterCanvas { display: none; }
  .section-title {
    font-size: 15px;
    font-weight: bold;
    color: #14283C;
    border-left: 4px solid #14283C;
    padding-left: 8px;
    margin: 16px 0 8px;

<h1>🏯 藤井寺タータンカラー選定ツール</h1>

<div class="container">
  <!-- 左パネル -->
  <div class="left-panel">
    <div class="guide-box">
<b>📖 使い方ガイド</b>
1. まずは、下のパレットから2色以上を選択します。
2. 糸の本数を微調整して「タータン生成」を押します。
3. デザインが表示されたら、色の並び替えや糸の数変更を行い、再度「タータン生成」を押してください。
4. 選定理由と「このタータンのコンセプトや想い」もご記入ください。
5. 完成したら、提出用のポスター画像とテキストデータを出力してください。
    </div>

    <div class="section-title">🎨 カラーパレット（137色）</div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="palette" id="palette"></div>
  </div>

  <!-- 右パネル -->
  <div class="right-panel">
    <div class="section-title">✅ 選択した色（<span id="selectedCount">0</span>色）</div>
    <div class="selected-list" id="selectedList"></div>

    <div class="controls-row">
      <label>🔁 繰り返し回数</label>
      <input type="number" id="repeatCount" value="6" min="1" max="20">
      <button class="btn" onclick="generatePattern()">🧶 タータン生成</button>
    </div>

    <canvas id="tartanCanvas" width="760" height="760"></canvas>

    <div style="text-align:center;">
      <button class="btn" onclick="downloadImage()">⬇ 高画質で保存</button>
      <button class="btn secondary" onclick="generatePoster()">🖼 ポスター作成</button>
      <button class="btn secondary" onclick="downloadPoster()">⬇ ポスターダウンロード</button>
    </div>

    <div class="name-input-area">
      <label for="nameInput">✒ 応募者名／団体名</label>
      <input type="text" id="nameInput" placeholder="例：藤井寺 太郎">

      <label for="conceptInput" style="margin-top:14px;">💭 このタータンのコンセプトや想いを書いてください</label>
      <textarea id="conceptInput" maxlength="120" rows="3"
        placeholder="例：藤井寺の伝統と未来への願いを込めて、歴史ある街の想いをイメージしました。"></textarea>
    </div>

    <div class="section-title">📋 提出用データ</div>
    <button class="btn" onclick="updateSubmissionText()">🔄 データ更新</button>
    <button class="btn" onclick="copySubmission()">📋 テキストをコピー</button>
    <textarea id="submissionText" readonly></textarea>

    <div style="margin-top:10px;">
      <span id="codeOutput">提出用コード：未生成</span>
      <button class="btn" style="padding:6px 12px;font-size:12px;" onclick="copyCode()">コピー</button>
    </div>
  </div>
</div>

<canvas id="posterCanvas" width="900" height="1400"></canvas>
<div class="toast" id="toast"></div>

const CAT_LABELS = {
  all:"すべて", red:"赤", blue:"青", green:"緑", yellow:"黄",
  neutral:"黒・灰・白", brown:"茶", purple:"紫", orange:"橙",
  pink:"桃", multi:"ミックス"
};

/* ===================== 状態管理 ===================== */
let currentFilter = "all";
let selectedColors = []; // {code,name,hex,threadCount,reason}
const MAX_COLORS = 8;
let lastSequence = null;

/* ===================== 初期化 ===================== */
function init(){
  renderFilterBar();
  renderPalette();
  renderSelected();
}

function renderFilterBar(){
  const bar = document.getElementById("filterBar");
  bar.innerHTML = "";
  Object.keys(CAT_LABELS).forEach(cat=>{
    const btn = document.createElement("div");
    btn.className = "filter-btn" + (cat===currentFilter ? " active" : "");
    btn.textContent = CAT_LABELS[cat];
    btn.onclick = ()=>{ currentFilter = cat; renderFilterBar(); renderPalette(); };
    bar.appendChild(btn);
  });
}

function renderPalette(){
  const palette = document.getElementById("palette");
  palette.innerHTML = "";
  const list = currentFilter==="all" ? COLORS : COLORS.filter(c=>c.cat===currentFilter);
  list.forEach(c=>{
    const isSelected = selectedColors.some(sc=>sc.code===c.code);
    const sw = document.createElement("div");
    sw.className = "swatch" + (isSelected ? " selected" : "");
    sw.style.background = c.hex;
    sw.title = `${c.code} ${c.name} (${c.hex})`;
    sw.onclick = ()=>toggleColor(c);
    palette.appendChild(sw);
  });
}

function toggleColor(c){
  const idx = selectedColors.findIndex(sc=>sc.code===c.code);
  if(idx>=0){
    selectedColors.splice(idx,1);
  } else {
    if(selectedColors.length>=MAX_COLORS){
      showToast(`⚠ 色は最大${MAX_COLORS}色までです`);
      return;
    }
    selectedColors.push({...c, threadCount:6, reason:""});
  }
  renderPalette();
  renderSelected();
}

function renderSelected(){
  const list = document.getElementById("selectedList");
  document.getElementById("selectedCount").textContent = selectedColors.length;
  list.innerHTML = "";
  selectedColors.forEach((c,i)=>{
    const row = document.createElement("div");
    row.className = "selected-item";
    row.innerHTML = `
      <div class="sw" style="background:${c.hex}"></div>
      <div class="info">
        <b>${c.code} ${c.name}</b><br>
        <span style="color:#888">${c.hex}</span><br>
        本数:<input type="number" min="2" step="2" value="${c.threadCount}"
          onchange="updateThreadCount(${i}, this.value)"><br>
        理由:<input type="text" maxlength="20" placeholder="20文字まで" value="${c.reason}"
          onchange="updateReason(${i}, this.value)">
      </div>
      <div class="reorder-btns">
        <button onclick="moveColor(${i},-1)">↑</button>
        <button onclick="moveColor(${i},1)">↓</button>
        <button class="remove-btn" onclick="removeColor(${i})">×</button>
      </div>
    `;
    list.appendChild(row);
  });
}

function updateThreadCount(i,val){
  let n = parseInt(val,10);
  if(isNaN(n) || n<2) n=2;
  if(n%2!==0){
    n = n+1;
    showToast("スレッド数は必ず2の倍数です → " + n + "本に補正しました");
  }
  selectedColors[i].threadCount = n;
  renderSelected();
}

function updateReason(i,val){
  selectedColors[i].reason = val.slice(0,20);
}

function moveColor(i,dir){
  const j = i+dir;
  if(j<0 || j>=selectedColors.length) return;
  [selectedColors[i], selectedColors[j]] = [selectedColors[j], selectedColors[i]];
  renderSelected();
}

function removeColor(i){
  selectedColors.splice(i,1);
  renderPalette();
  renderSelected();
}

/* ===================== パターン生成 ===================== */
function hexToRgb(hex){
  const v = parseInt(hex.replace("#",""),16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}

function shade(rgb, factor){
  return rgb.map(v=>Math.min(255, Math.max(0, Math.round(v*factor))));
}

function buildSequence(){
  let half = [];
  selectedColors.forEach(c=>{
    for(let i=0;i<c.threadCount;i++) half.push(c.hex);
  });
  // 左右対称（ミラー）にするため、半分を反転して結合（ピボット糸は重複させない）
  const mirrored = half.concat(half.slice(0,-1).reverse());
  return mirrored;
}

function drawTartan(canvas, sequence, size, repeatCount){
  const ctx = canvas.getContext("2d");
  canvas.width = size;
  canvas.height = size;
  const seqLen = sequence.length;
  const totalThreads = seqLen * repeatCount;
  const rgbSeq = sequence.map(hexToRgb);

  const imgData = ctx.createImageData(size, size);
  const data = imgData.data;

  for(let y=0; y<size; y++){
    const yPos = Math.floor(y/size*totalThreads);
    const weftIdx = yPos % seqLen;
    for(let x=0; x<size; x++){
      const xPos = Math.floor(x/size*totalThreads);
      const warpIdx = xPos % seqLen;
      const diag = (xPos + yPos) % 4;
      let rgb;
      if(diag < 2){
        rgb = shade(rgbSeq[warpIdx], 1.08); // 経糸：ハイライト
      } else {
        rgb = shade(rgbSeq[weftIdx], 0.85); // 緯糸：シャドウ
      }
      const idx = (y*size+x)*4;
      data[idx]=rgb[0]; data[idx+1]=rgb[1]; data[idx+2]=rgb[2]; data[idx+3]=255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function generatePattern(){
  if(selectedColors.length < 2){
    alert("2色以上選択してください");
    return;
  }
  const repeatCount = parseInt(document.getElementById("repeatCount").value,10) || 6;
  lastSequence = buildSequence();
  const canvas = document.getElementById("tartanCanvas");
  drawTartan(canvas, lastSequence, 760, repeatCount);
  updateSubmissionText();
  showToast("🧶 タータンを生成しました");
}

/* ===================== 高画質保存 ===================== */
function downloadImage(){
  if(!lastSequence){ alert("先にタータンを生成してください"); return; }
  const repeatCount = parseInt(document.getElementById("repeatCount").value,10) || 6;
  const tmp = document.createElement("canvas");
  drawTartan(tmp, lastSequence, 1600, repeatCount);
  const link = document.createElement("a");
  link.download = "tartan_fujiidera.jpg";
  link.href = tmp.toDataURL("image/jpeg", 0.95);
  link.click();
}

/* ===================== ポスター生成 ===================== */
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  let line = "";
  let currentY = y;
  for(let i=0;i<text.length;i++){
    const test = line + text[i];
    if(ctx.measureText(test).width > maxWidth && line.length>0){
      ctx.fillText(line, x, currentY);
      line = text[i];
      currentY += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, currentY);
  return currentY + lineHeight;
}

function generatePoster(){
  if(!lastSequence){ alert("先にタータンを生成してください"); return; }
  const repeatCount = parseInt(document.getElementById("repeatCount").value,10) || 6;
  const name = document.getElementById("nameInput").value || "（未入力）";
  const concept = document.getElementById("conceptInput").value || "";

  const poster = document.getElementById("posterCanvas");
  const W = 900, H = 1400;
  poster.width = W; poster.height = H;
  const ctx = poster.getContext("2d");

  // 背景
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, "#fdfcf9");
  grad.addColorStop(1, "#f3f1ea");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // 外枠装飾
  ctx.strokeStyle = "#C9AE5D";
  ctx.lineWidth = 3;
  ctx.strokeRect(20,20,W-40,H-40);
  ctx.strokeStyle = "#14283C";
  ctx.lineWidth = 1;
  ctx.strokeRect(28,28,W-56,H-56);

  // 上部：協議会名
  ctx.textAlign = "center";
  ctx.fillStyle = "#8a6d00";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("藤井寺まちリンク協議会", W/2, 65);
  ctx.strokeStyle = "#C9AE5D";
  ctx.beginPath();
  ctx.moveTo(100,85); ctx.lineTo(W-100,85); ctx.stroke();

  // 応募者名（右寄せ・30px）
  ctx.textAlign = "right";
  ctx.fillStyle = "#666";
  ctx.font = "14px sans-serif";
  ctx.fillText("応募者名／団体名", W-70, 120);
  ctx.fillStyle = "#14283C";
  ctx.font = "bold 30px sans-serif";
  ctx.fillText(name, W-70, 158);

  // タータンパターン（固定760px中央配置）
  const patSize = 760;
  const patX = (W - patSize)/2;
  const patY = 185;
  const tmp = document.createElement("canvas");
  drawTartan(tmp, lastSequence, patSize, repeatCount);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.25)";
  ctx.shadowBlur = 16;
  ctx.drawImage(tmp, patX, patY, patSize, patSize);
  ctx.restore();
  ctx.strokeStyle = "#14283C";
  ctx.lineWidth = 2;
  ctx.strokeRect(patX, patY, patSize, patSize);

  let curY = patY + patSize + 45;

  // コンセプト・想い
  if(concept.trim() !== ""){
    ctx.textAlign = "left";
    ctx.fillStyle = "#14283C";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("■ このタータンのコンセプト・想い", 70, curY);
    curY += 24;
    ctx.font = "14px sans-serif";
    ctx.fillStyle = "#333";
    curY = wrapText(ctx, concept, 70, curY, W-140, 20);
    curY += 10;
  }

  // 使用色一覧（最大6色）
  ctx.fillStyle = "#14283C";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("■ 使用色一覧", 70, curY);
  curY += 10;

  const showColors = selectedColors.slice(0,6);
  const colW = (W-140)/2;
  showColors.forEach((c, i)=>{
    const col = i % 2;
    const row = Math.floor(i/2);
    const bx = 70 + col*colW;
    const by = curY + 20 + row*54;

    ctx.fillStyle = c.hex;
    ctx.fillRect(bx, by-16, 26, 26);
    ctx.strokeStyle = "#999";
    ctx.strokeRect(bx, by-16, 26, 26);

    ctx.fillStyle = "#222";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`${c.code} ${c.name} (${c.hex}) ${c.threadCount}本`, bx+34, by-2);
    ctx.font = "12px sans-serif";
    ctx.fillStyle = "#666";
    ctx.fillText(c.reason ? `理由: ${c.reason}` : "", bx+34, by+16);
  });

  const rows = Math.ceil(showColors.length/2);
  curY = curY + 20 + rows*54 + 20;

  // 提出用コード
  const code = buildSubmissionCode();
  ctx.textAlign = "center";
  ctx.font = "12px monospace";
  ctx.fillStyle = "#999";
  ctx.fillText(`提出用コード: ${code}`, W/2, H-70);

  // 下部：協議会名
  ctx.strokeStyle = "#C9AE5D";
  ctx.beginPath();
  ctx.moveTo(100, H-55); ctx.lineTo(W-100, H-55); ctx.stroke();
  ctx.fillStyle = "#8a6d00";
  ctx.font = "bold 16px sans-serif";
  ctx.fillText("藤井寺まちリンク協議会", W/2, H-35);

  showToast("🖼 ポスターを生成しました");
}

function downloadPoster(){
  const poster = document.getElementById("posterCanvas");
  if(poster.width===0){ alert("先にポスターを作成してください"); return; }
  const link = document.createElement("a");
  link.download = "tartan_poster_fujiidera.jpg";
  link.href = poster.toDataURL("image/jpeg", 0.95);
  link.click();
}

/* ===================== 提出用データ ===================== */
function buildSubmissionCode(){
  if(selectedColors.length===0) return "未選択";
  return "FJD-" + selectedColors.map(c=>c.code+c.threadCount).join("-");
}

function updateSubmissionText(){
  const name = document.getElementById("nameInput").value || "（未入力）";
  const concept = document.getElementById("conceptInput").value || "（未入力）";
  const repeatCount = document.getElementById("repeatCount").value;

  let text = "";
  text += "■ 藤井寺タータンデザイン 提出データ\n";
  text += "========================================\n";
  text += `応募者名／団体名：${name}\n\n`;
  text += "【コンセプト・想い】\n" + concept + "\n\n";
  text += "【使用色一覧】（コード・色名・HEX・本数・理由）\n";
  let total = 0;
  selectedColors.forEach((c,i)=>{
    text += `${i+1}. ${c.code} ${c.name} ${c.hex} - ${c.threadCount}本 - 理由: ${c.reason || "（未記入）"}\n`;
    total += c.threadCount;
  });
  text += `\n【スレッド構成】\n`;
  text += `繰り返し回数: ${repeatCount}\n`;
  text += `1セットあたり合計糸数（片側）: ${total}本\n\n`;
  text += `【提出用コード】\n${buildSubmissionCode()}\n`;

  document.getElementById("submissionText").value = text;
  document.getElementById("codeOutput").textContent = "提出用コード：" + buildSubmissionCode();
}

function copySubmission(){
  const text = document.getElementById("submissionText").value;
  if(!text){ alert("先にデータを更新してください"); return; }
  navigator.clipboard.writeText(text).then(()=>showToast("📋 テキストをコピーしました"));
}

function copyCode(){
  const code = buildSubmissionCode();
  navigator.clipboard.writeText(code).then(()=>showToast("🔑 コードをコピーしました"));
}

/* ===================== トースト通知 ===================== */
let toastTimer = null;
function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 2200);
}

/* ===================== 起動 ===================== */
init();
</script>
