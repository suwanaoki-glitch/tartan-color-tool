<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タータン・レジスター カラー選定＆パターン作成ツール</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  h1 { text-align: center; color: #333; }
  h2 { border-left: 6px solid #555; padding-left: 10px; margin-top: 30px; }
  section {
    background: #fff;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  #orgSection input {
    width: 320px; padding: 8px; font-size: 14px;
    border: 1px solid #ccc; border-radius: 4px;
  }
  .catBtn {
    padding: 6px 14px; margin: 3px; border: 1px solid #999;
    background: #eee; border-radius: 20px; cursor: pointer; font-size: 13px;
  }
  .catBtn.active { background: #333; color: #fff; border-color: #333; }
  .palette-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
    padding: 6px;
    border: 1px solid #eee;
    border-radius: 6px;
  }
  .swatch {
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #ccc;
    text-align: center;
    font-size: 10px;
    transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.06); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .swatch .box { width: 100%; height: 50px; }
  .swatch .label { background: #fff; padding: 2px 0; line-height: 1.3; }
  #selectedList { display: flex; flex-direction: column; gap: 8px; }
  .selRow {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #ddd; border-radius: 6px; padding: 8px;
    background: #fafafa; flex-wrap: wrap;
  }
  .selRow .colorBox {
    width: 36px; height: 36px; border-radius: 4px; border: 1px solid #999; flex-shrink:0;
  }
  .selRow .info { font-size: 12px; min-width: 150px; }
  .selRow input[type=number] { width: 64px; padding: 4px; }
  .selRow input[type=text] { width: 160px; padding: 4px; }
  .selRow button {
    border: none; background: #999; color: #fff; border-radius: 4px;
    padding: 4px 8px; cursor: pointer; font-size: 12px;
  }
  .selRow button.danger { background: #c0392b; }
  .warn { color: #c0392b; font-size: 11px; margin-left: 4px; }
  #controls label { margin-right: 20px; font-size: 14px; }
  #controls input { padding: 6px; width: 100px; }
  #generateBtn, #downloadBtn, #posterBtn, #copyDataBtn {
    padding: 10px 18px; font-size: 14px; border: none; border-radius: 6px;
    cursor: pointer; margin-right: 10px; margin-top: 8px;
    background: #2c3e50; color: #fff;
  }
  #generateBtn:hover, #downloadBtn:hover, #posterBtn:hover, #copyDataBtn:hover { background: #1a252f; }
  #patternSection { text-align: center; }
  #patternCanvas {
    max-width: 100%; border: 1px solid #ccc; background: #fff;
  }
  #submissionText {
    width: 100%; font-family: monospace; font-size: 13px; padding: 10px;
    border: 1px solid #ccc; border-radius: 6px;
  }
  .instructions { font-size: 13px; line-height: 1.8; background:#eef6ff; padding:12px; border-radius:6px;}
  #posterCanvas { display:none; }
</style>
</head>
<body>
<div class="container">

  <h1>🏴 タータン・レジスター カラー選定＆パターン作成ツール</h1>

  <section class="instructions">
    <strong>📘 使い方</strong><br>
    ① 団体名を入力 → ② 下の137色パレットから色をクリックして選択（2色以上）<br>
    ③ 各色のスレッド数（必ず偶数）・選定理由（20文字まで）を入力・並び替え<br>
    ④ 「パターンを生成」をクリック → 真の2/2綾織り・左右対称パターンが表示されます<br>
    ⑤ 高画質保存／ポスター作成／提出データのコピーが可能です
  </section>

  <section id="orgSection">
    <label>団体名／お名前：
      <input id="orgName" type="text" placeholder="例）藤井寺まちリンク協議会">
    </label>
  </section>

  <section id="categoryFilter">
    <strong>🎨 カテゴリ絞り込み：</strong><br>
    <button class="catBtn active" data-cat="all">すべて</button>
    <button class="catBtn" data-cat="Red">赤系</button>
    <button class="catBtn" data-cat="Orange">橙系</button>
    <button class="catBtn" data-cat="Yellow">黄系</button>
    <button class="catBtn" data-cat="Green">緑系</button>
    <button class="catBtn" data-cat="Blue">青系</button>
    <button class="catBtn" data-cat="Purple">紫系</button>
    <button class="catBtn" data-cat="White">白系</button>
    <button class="catBtn" data-cat="Grey">灰系</button>
    <button class="catBtn" data-cat="Black">黒</button>
    <button class="catBtn" data-cat="Brown">茶系</button>
  </section>

  <section id="paletteSection">
    <h2>① 公式137色パレット</h2>
    <div id="palette" class="palette-grid"></div>
  </section>

  <section id="selectedSection">
    <h2>② 選択した色（並び替え・スレッド数・理由）</h2>
    <div id="selectedList"></div>
  </section>

  <section id="controls">
    <h2>③ パターン設定</h2>
    <label>繰り返し回数：<input id="repeatCount" type="number" value="6" min="1" max="20"></label>
    <label>画像サイズ(px)：<input id="canvasSize" type="number" value="1600" min="400" max="4000" step="100"></label>
    <br>
    <button id="generateBtn">🎨 パターンを生成（真の2/2綾織り・左右対称）</button>
  </section>

  <section id="patternSection">
    <h2>④ プレビュー</h2>
    <canvas id="patternCanvas" width="1600" height="1600"></canvas>
  </section>

  <section id="exportSection">
    <h2>⑤ 書き出し</h2>
    <button id="downloadBtn">⬇ 高画質で保存</button>
    <button id="posterBtn">🖼 ポスターを作成（藤井寺まちリンク協議会）</button>
    <button id="copyDataBtn">📋 提出データをコピー</button>
  </section>

  <section id="submissionSection">
    <h2>⑥ 提出データ</h2>
    <textarea id="submissionText" rows="16" readonly></textarea>
  </section>

</div>

/* ============================================================
   カテゴリ分類
============================================================ */
function getCategory(name){
  if(name.includes("Red")) return "Red";
  if(name.includes("Orange")) return "Orange";
  if(name.includes("Yellow")) return "Yellow";
  if(name.includes("Green")) return "Green";
  if(name.includes("Blue")) return "Blue";
  if(name.includes("Purple")) return "Purple";
  if(name.includes("White")) return "White";
  if(name.includes("Grey")) return "Grey";
  if(name.includes("Black")) return "Black";
  if(name.includes("Brown")) return "Brown";
  return "Other";
}

/* ============================================================
   状態管理
============================================================ */
let currentCategory = "all";
let selected = []; // {uid, name, hex, code, threadCount, reason}
let uidCounter = 0;

/* ============================================================
   パレット描画
============================================================ */
const paletteEl = document.getElementById("palette");

function renderPalette(){
  paletteEl.innerHTML = "";
  RAW_COLORS.forEach(([name, hex, code]) => {
    const cat = getCategory(name);
    if(currentCategory !== "all" && cat !== currentCategory) return;
    const div = document.createElement("div");
    div.className = "swatch";
    div.title = `${name} ${hex} (${code})`;
    div.innerHTML = `
      <div class="box" style="background:${hex}"></div>
      <div class="label">${code}<br>${hex}</div>
    `;
    div.addEventListener("click", () => addColor(name, hex, code));
    paletteEl.appendChild(div);
  });
}

document.querySelectorAll(".catBtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".catBtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentCategory = btn.dataset.cat;
    renderPalette();
  });
});

/* ============================================================
   選択色リスト
============================================================ */
function addColor(name, hex, code){
  selected.push({
    uid: uidCounter++,
    name, hex, code,
    threadCount: 6,
    reason: ""
  });
  renderSelected();
}

function removeColor(uid){
  selected = selected.filter(s=>s.uid!==uid);
  renderSelected();
}

function moveColor(uid, dir){
  const idx = selected.findIndex(s=>s.uid===uid);
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= selected.length) return;
  [selected[idx], selected[newIdx]] = [selected[newIdx], selected[idx]];
  renderSelected();
}

function renderSelected(){
  const listEl = document.getElementById("selectedList");
  listEl.innerHTML = "";
  if(selected.length===0){
    listEl.innerHTML = "<p style='color:#999;'>パレットから色をクリックして選択してください（2色以上推奨）</p>";
    return;
  }
  selected.forEach((item, idx) => {
    const row = document.createElement("div");
    row.className = "selRow";
    row.innerHTML = `
      <div class="colorBox" style="background:${item.hex}"></div>
      <div class="info">${item.name}<br>${item.hex} (${item.code})</div>
      <label>スレッド数:
        <input type="number" value="${item.threadCount}" min="2" step="2" data-uid="${item.uid}" class="threadInput">
      </label>
      <span class="warnSpan-${item.uid}" class="warn"></span>
      <label>選定理由:
        <input type="text" maxlength="20" placeholder="20文字まで" value="${item.reason}" data-uid="${item.uid}" class="reasonInput">
      </label>
      <button data-uid="${item.uid}" class="upBtn">↑</button>
      <button data-uid="${item.uid}" class="downBtn">↓</button>
      <button data-uid="${item.uid}" class="danger delBtn">削除</button>
    `;
    listEl.appendChild(row);
  });

  // イベント登録
  document.querySelectorAll(".threadInput").forEach(inp=>{
    inp.addEventListener("change", (e)=>{
      const uid = Number(e.target.dataset.uid);
      let val = parseInt(e.target.value) || 2;
      if(val % 2 !== 0){
        val += 1;
        alert("⚠ スレッド数は必ず2の倍数です。自動的に " + val + " に補正しました。");
        e.target.value = val;
      }
      const item = selected.find(s=>s.uid===uid);
      if(item) item.threadCount = val;
    });
  });

  document.querySelectorAll(".reasonInput").forEach(inp=>{
    inp.addEventListener("input", (e)=>{
      const uid = Number(e.target.dataset.uid);
      const item = selected.find(s=>s.uid===uid);
      if(item) item.reason = e.target.value;
    });
  });

  document.querySelectorAll(".upBtn").forEach(btn=>{
    btn.addEventListener("click",(e)=> moveColor(Number(e.target.dataset.uid), -1));
  });
  document.querySelectorAll(".downBtn").forEach(btn=>{
    btn.addEventListener("click",(e)=> moveColor(Number(e.target.dataset.uid), 1));
  });
  document.querySelectorAll(".delBtn").forEach(btn=>{
    btn.addEventListener("click",(e)=> removeColor(Number(e.target.dataset.uid)));
  });
}

/* ============================================================
   パターン生成（真の2/2綾織り・左右対称ミラー）
============================================================ */
function buildMirroredSequence(){
  let seq = [];
  selected.forEach(item=>{
    for(let i=0;i<item.threadCount;i++) seq.push(item.hex);
  });
  if(seq.length===0) return [];
  // 左右対称（ミラー）: 末尾を反転して結合（両端の色を重複させない）
  const mirrored = seq.concat(seq.slice(0,-1).reverse());
  return mirrored;
}

function drawTartanPattern(){
  if(selected.length < 2){
    alert("⚠ 色を2色以上選択してください。");
    return;
  }

  const canvas = document.getElementById("patternCanvas");
  const size = parseInt(document.getElementById("canvasSize").value) || 1600;
  const repeatCount = parseInt(document.getElementById("repeatCount").value) || 6;

  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  const sett = buildMirroredSequence();
  const settLen = sett.length;
  if(settLen===0) return;

  // パフォーマンス対策：総セル数を制限
  let totalUnits = settLen * repeatCount;
  let effectiveRepeat = repeatCount;
  const MAX_UNITS = 1400;
  if(totalUnits > MAX_UNITS){
    effectiveRepeat = Math.max(1, Math.floor(MAX_UNITS / settLen));
    totalUnits = settLen * effectiveRepeat;
  }

  const scale = size / totalUnits;

  ctx.clearRect(0,0,size,size);

  for(let iy=0; iy<totalUnits; iy++){
    const weftIdx = iy % settLen;
    for(let ix=0; ix<totalUnits; ix++){
      const warpIdx = ix % settLen;
      // 2/2綾織り判定：対角オフセット
      const offset = ((warpIdx - weftIdx) % 4 + 4) % 4;
      const color = (offset < 2) ? sett[warpIdx] : sett[weftIdx];
      ctx.fillStyle = color;
      ctx.fillRect(
        Math.floor(ix*scale),
        Math.floor(iy*scale),
        Math.ceil(scale)+1,
        Math.ceil(scale)+1
      );
    }
  }

  generateSubmissionData();
}

document.getElementById("generateBtn").addEventListener("click", drawTartanPattern);

/* ============================================================
   高画質で保存
============================================================ */
document.getElementById("downloadBtn").addEventListener("click", ()=>{
  const canvas = document.getElementById("patternCanvas");
  const link = document.createElement("a");
  const orgName = document.getElementById("orgName").value || "tartan";
  link.download = `${orgName}_tartan_pattern.jpg`;
  link.href = canvas.toDataURL("image/jpeg", 0.98);
  link.click();
});

/* ============================================================
   ポスター作成（上下に「藤井寺まちリンク協議会」）
============================================================ */
document.getElementById("posterBtn").addEventListener("click", ()=>{
  const patternCanvas = document.getElementById("patternCanvas");
  if(!patternCanvas.width) { alert("先にパターンを生成してください。"); return; }

  const posterCanvas = document.getElementById("posterCanvas");
  const W = 1800, H = 2400;
  posterCanvas.width = W;
  posterCanvas.height = H;
  const ctx = posterCanvas.getContext("2d");

  // 背景
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,W,H);

  // 上部テキスト
  ctx.fillStyle = "#222";
  ctx.textAlign = "center";
  ctx.font = "bold 72px 'Hiragino Kaku Gothic ProN', sans-serif";
  ctx.fillText("藤井寺まちリンク協議会", W/2, 140);

  // パターン画像（中央配置）
  const patSize = 1500;
  const patX = (W - patSize)/2;
  const patY = 260;
  ctx.drawImage(patternCanvas, patX, patY, patSize, patSize);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 4;
  ctx.strokeRect(patX, patY, patSize, patSize);

  // 団体名（任意表示）
  const orgName = document.getElementById("orgName").value;
  if(orgName){
    ctx.font = "40px 'Hiragino Kaku Gothic ProN', sans-serif";
    ctx.fillText(orgName, W/2, patY + patSize + 70);
  }

  // 下部テキスト
  ctx.font = "bold 72px 'Hiragino Kaku Gothic ProN', sans-serif";
  ctx.fillText("藤井寺まちリンク協議会", W/2, H - 80);

  // 書き出し
  const link = document.createElement("a");
  link.download = `${orgName || "tartan"}_poster.jpg`;
  link.href = posterCanvas.toDataURL("image/jpeg", 0.98);
  link.click();
});

/* ============================================================
   提出データ生成
============================================================ */
function generateSubmissionData(){
  const orgName = document.getElementById("orgName").value || "(未入力)";
  const repeatCount = document.getElementById("repeatCount").value;
  const canvasSize = document.getElementById("canvasSize").value;

  // 同一コードへの連番付与（例：R1, R2）
  const codeCount = {};
  const labeled = selected.map(item=>{
    codeCount[item.code] = (codeCount[item.code]||0)+1;
    return { ...item, label: item.code + codeCount[item.code] };
  });

  let lines = [];
  lines.push("■ 提出データ（タータン・レジスター申請用）");
  lines.push("------------------------------------------");
  lines.push("団体名／申請者名: " + orgName);
  lines.push("");
  lines.push("■ 使用色一覧（色コード＋番号形式）");
  labeled.forEach(item=>{
    lines.push(`${item.label}  ${item.hex}（${item.name}）  スレッド数: ${item.threadCount}本  理由: ${item.reason || "(未入力)"}`);
  });
  lines.push("");

  const totalHalf = labeled.reduce((s,i)=>s+i.threadCount,0);
  const mirroredTotal = labeled.length>0
    ? totalHalf*2 - labeled[0].threadCount
    : 0;

  lines.push("■ セット表記（ハーフセット／ミラー前）");
  lines.push(labeled.map(i=>`${i.label}/${i.threadCount}`).join(" "));
  lines.push("");
  lines.push(`■ 合計スレッド数（片側）: ${totalHalf}本`);
  lines.push(`■ 合計スレッド数（左右対称ミラー後・1リピート）: ${mirroredTotal}本`);
  lines.push("");
  lines.push("■ パターン生成設定");
  lines.push(`繰り返し回数: ${repeatCount}`);
  lines.push(`画像サイズ: ${canvasSize}px`);
  lines.push(`織り方: 2/2綾織り（左右対称ミラーパターン）`);

  document.getElementById("submissionText").value = lines.join("\n");
}

document.getElementById("copyDataBtn").addEventListener("click", ()=>{
  if(selected.length < 2){
    alert("⚠ 先に色を選択し、パターンを生成してください。");
    return;
  }
  generateSubmissionData();
  const textarea = document.getElementById("submissionText");
  textarea.select();
  navigator.clipboard.writeText(textarea.value).then(()=>{
    alert("✅ 提出データをクリップボードにコピーしました。");
  }).catch(()=>{
    document.execCommand("copy");
    alert("✅ 提出データをコピーしました（フォールバック）。");
  });
});

/* ============================================================
   初期化
============================================================ */
renderPalette();
renderSelected();
</script>
</body>
</html>
